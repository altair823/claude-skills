# Test fixture inventory — stable, decoupled from the operator's live
# inventory/fleet.yaml. The stub-driven suite points HOMELAB_INVENTORY_DIR
# here (see tests/lib.sh). Do NOT put real hosts/credentials in this file.
# Credentials are REFERENCES ONLY (bw://...). No secret value lives in any file.
- id: pve-01
  kind: proxmox-host
  address: 10.0.0.11
  env: prod
  access:
    api: { token_ref: "bw://Proxmox pve-01/api-token" }
    ssh: { user: root, key_ref: "bw://ssh-pve-01" }
  children: [vm-100, lxc-201]
  tags: [critical]

- id: vm-100
  kind: vm
  address: 10.0.0.100
  env: prod
  vmid: 100
  access:
    ssh: { user: ops, key_ref: "bw://ssh-vm-100" }
  tags: []

- id: lxc-201
  kind: lxc
  address: 10.0.0.201
  env: prod
  vmid: 201
  access:
    ssh: { user: root, key_ref: "bw://ssh-lxc-201" }
  tags: []

- id: nas-01
  kind: appliance
  address: 10.0.0.50
  env: prod
  access:
    ssh: { user: admin, key_ref: "bw://ssh-nas-01" }
  tags: [critical]

