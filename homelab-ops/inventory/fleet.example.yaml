# EXAMPLE inventory — copy to inventory/fleet.yaml and replace with your fleet.
# (inventory/fleet.yaml + groups.yaml + ca/ are gitignored: operator-local,
# environment-specific. The test suite never reads these — it uses
# tests/fixtures/ via HOMELAB_INVENTORY_DIR.)
#
# Rules:
#  - Credentials are REFERENCES ONLY (bw://...). No secret value in any file.
#  - A proxmox-host `id` MUST equal the real PVE node name (API paths are
#    /nodes/<id>/...).
#  - access.api.ca_path → that node's /etc/pve/pve-root-ca.pem so curl keeps
#    TLS verification ON (independent nodes each have a DISTINCT CA).
#  - Place each node's CA yourself: copy /etc/pve/pve-root-ca.pem from the node
#    to inventory/ca/<host-id>-ca.pem (inventory/ca/ is gitignored, so it is
#    empty on a fresh clone — ca_path will fail closed until you populate it).
- id: pve-01
  kind: proxmox-host
  address: 10.0.0.11
  env: prod
  access:
    api: { token_ref: "bw://Proxmox pve-01/api-token", ca_path: "inventory/ca/pve-01-ca.pem" }
    ssh: { user: root, key_ref: "bw://ssh-pve-01/notes" }
  children: [vm-100, lxc-201]
  tags: [critical]
  # Optional. Operator-declared physical capacity contract for VM placement
  # planning. `inv specs <id>` prints this block (no credentials). `guard
  # verify-specs <id>` (safe, needs PVE_TOKEN) cross-checks against the live
  # PVE API and surfaces drift. `guard hwsync <id>` regenerates this block
  # from the live source for any kind (proxmox-host/vm/lxc/appliance).
  hardware:
    resource_type: physical   # physical | virtual — auto-set by `guard hwsync`
    cpu:
      model: "AMD Ryzen 7 7700"   # informational (vendor string)
      sockets: 1
      cores: 8                     # total physical cores (= PVE cpuinfo.cores)
      threads: 16                  # total logical CPUs   (= PVE cpuinfo.cpus)
    memory:
      total_gib: 128
      reserved_gib: 8              # operator policy — usable for VMs = total - reserved
    storages:
      # name+type verified exactly. size_tib/size_gib verified within ±5%.
      - { name: local-zfs, type: zfs, size_tib: 2.0 }
      - { name: local-lvm, type: lvmthin, size_gib: 500 }
    nics:
      # speed_gbps is informational — PVE API does not expose link speed.
      # The iface name's existence on the node IS verified.
      - { name: vmbr0, speed_gbps: 1 }
    passthrough:
      # `id` is "vendor:device" in lowercase hex (matched against /hardware/pci).
      # `kind` and `bound_to` are operator metadata (not verified).
      - { kind: gpu, id: "10de:2206", bound_to: workspace-02, note: "RTX 3080" }

- id: vm-100
  kind: vm
  address: 10.0.0.100
  env: prod
  vmid: 100
  # disk-attach 물리 패스스루를 허용할 디스크의 안정 식별 serial (opt-in).
  # 미선언 시 disk-attach 거부(아무 디스크나 패스스루 차단).
  disks:
    - serial: "CHANGE-ME-DISK-SERIAL"
  access:
    ssh: { user: ops, key_ref: "bw://ssh-vm-100/notes" }
  tags: []

- id: lxc-201
  kind: lxc
  address: 10.0.0.201
  env: prod
  vmid: 201
  access:
    ssh: { user: root, key_ref: "bw://ssh-lxc-201/notes" }
  tags: []

- id: nas-01
  kind: appliance
  address: 10.0.0.50
  env: prod
  access:
    ssh: { user: admin, auth: password, pass_ref: "bw://ssh-nas-01-pass" }
  tags: [critical]

# PDM (Proxmox Datacenter Manager) — remote-migrate transport 의 단일 출처.
# 정확히 1개. address 에 :port 포함 가능. base_path/task_status_path/
# migrate_path 는 운영자 PDM 버전에 맞춰 조정(미지정 시 아래 기본값).
- id: pdm-01
  kind: pdm
  address: pdm.example.lan:8443
  env: prod
  access:
    api:
      token_ref: "bw://Proxmox-Datacenter-Manager pdm-01/api-token"
      ca_path: "inventory/ca/pdm-01-ca.pem"
      # base_path: "/api2/json"
      # task_status_path: "/tasks"
      # migrate_path: "/nodes/{src}/qemu/{vmid}/remote_migrate"
  tags: []
